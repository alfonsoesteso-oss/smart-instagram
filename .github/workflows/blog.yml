name: Anunciar blog en Instagram

on:
  schedule:
    - cron: "23 * * * *"     # cada hora (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - publicador/blog.py
      - blog.json
      - .github/workflows/blog.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar-instagram   # el mismo grupo que "Publicar en Instagram": nunca se pisan
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow

      - name: Configurar git
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"

      - name: Si una imagen lleva tiempo sin aparecer en GitHub Pages, pedir un nuevo despliegue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' && curl -s -o /dev/null -w "Nuevo build de Pages: HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
          import json, sys, urllib.request
          pend = json.load(open("blog.json")).get("pendientes", [])
          for e in pend:
              u = "https://alfonsoesteso-oss.github.io/smart-instagram/" + e["medio"]
              try:
                  urllib.request.urlopen(urllib.request.Request(u, method="HEAD"), timeout=30)
              except Exception:
                  sys.exit(0)   # falta alguna imagen: pedir build
          sys.exit(1)           # todo en línea (o nada pendiente): no hace falta
          PY

      - name: Buscar entradas nuevas en el blog
        id: preparar
        run: python publicador/blog.py preparar

      - name: Subir la imagen (el push lanza la publicación en GitHub Pages)
        run: |
          git add blog.json medios/blog 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Blog: imagen para Instagram"
            git pull --rebase && git push
          fi

      - name: Añadir al calendario cuando la imagen esté en línea
        id: programar
        env:
          ESPERA_PAGES: "900"   # espera hasta 15 min a GitHub Pages; si no, se reintenta en la siguiente hora
        run: |
          python publicador/blog.py programar
          python publicador/probar.py
          git add blog.json calendario.json
          if ! git diff --cached --quiet; then
            git commit -m "Blog: anuncio añadido al calendario de Instagram"
            git pull --rebase && git push
          fi

      - name: Publicar ya en Instagram
        if: steps.programar.outputs.hay == 'si'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicador/publicar.py

      - name: Guardar estado
        if: always()
        run: |
          git add estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizar estado de publicaciones" && git pull --rebase && git push)
