name: Anunciar blog en Instagram

on:
  schedule:
    - cron: "23 * * * *"     # cada hora (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - publicador/blog.py
      - blog.json
      - .github/workflows/blog.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar-instagram   # el mismo grupo que "Publicar en Instagram": nunca se pisan
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow

      - name: Configurar git
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"

      - name: Buscar entradas nuevas en el blog
        id: preparar
        run: python publicador/blog.py preparar

      - name: Subir la imagen y pedir a GitHub Pages que la publique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add blog.json medios/blog 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Blog: imagen para Instagram"
            git pull --rebase && git push
          fi
          if python -c "import json,sys;sys.exit(0 if json.load(open('blog.json'))['pendientes'] else 1)"; then
            curl -s -o /dev/null -w "Petición de build de Pages: HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
          fi

      - name: Añadir al calendario cuando la imagen esté en línea
        id: programar
        env:
          ESPERA_PAGES: "900"   # espera hasta 15 min a GitHub Pages; si no, se reintenta en la siguiente hora
        run: |
          python publicador/blog.py programar
          python publicador/probar.py
          git add blog.json calendario.json
          if ! git diff --cached --quiet; then
            git commit -m "Blog: anuncio añadido al calendario de Instagram"
            git pull --rebase && git push
          fi

      - name: Publicar ya en Instagram
        if: steps.programar.outputs.hay == 'si'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicador/publicar.py

      - name: Guardar estado
        if: always()
        run: |
          git add estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizar estado de publicaciones" && git pull --rebase && git push)
