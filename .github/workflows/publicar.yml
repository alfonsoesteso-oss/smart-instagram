name: Publicar en Instagram

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}       # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar conexión con Instagram (solo al lanzarlo a mano)
        if: github.event_name == 'workflow_dispatch'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicador/publicar.py --comprobar
      - name: Publicar lo pendiente
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicador/publicar.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizar estado de publicaciones" && git pull --rebase && git push)
